
name: Inspect Israeli Transit Data

on:
  workflow_dispatch:
    inputs:
      service_ids:
        description: "Service IDs to investigate, separated by commas"
        required: false
        default: "5,6,25,26,27,28,129,131,132,134,151,153,154,155"

permissions:
  contents: read

concurrency:
  group: transit-data-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Build temporary database and inspect data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official transport data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/source build/output

          curl -fL --retry 3 --retry-delay 5 \
            "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip" \
            -o build/source/israel-public-transportation.zip

          curl -fL --retry 3 --retry-delay 5 \
            "https://gtfs.mot.gov.il/gtfsfiles/RouteNetworksByDate_10_Days.zip" \
            -o build/source/RouteNetworksByDate_10_Days.zip

      - name: Verify source archives
        shell: bash
        run: |
          set -euo pipefail

          python -m zipfile -t build/source/israel-public-transportation.zip
          python -m zipfile -t build/source/RouteNetworksByDate_10_Days.zip

      - name: Build temporary SQLite database
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_data.py \
            --gtfs build/source/israel-public-transportation.zip \
            --networks build/source/RouteNetworksByDate_10_Days.zip \
            --output build/output/israel-transit.sqlite

      - name: Validate calendar and trip services
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sqlite3
          from datetime import datetime, timedelta

          db = sqlite3.connect(
              "build/output/israel-transit.sqlite"
          )
          db.row_factory = sqlite3.Row

          required = {
              "service_id",
              "sunday", "monday", "tuesday", "wednesday",
              "thursday", "friday", "saturday",
              "start_date", "end_date"
          }

          actual = {
              row["name"]
              for row in db.execute('PRAGMA table_info("calendar")')
          }

          missing = required - actual

          if missing:
              raise SystemExit(
                  "Missing calendar columns: "
                  + ", ".join(sorted(missing))
              )

          trip_columns = {
              row["name"]
              for row in db.execute('PRAGMA table_info("trips")')
          }

          if "service_id" not in trip_columns:
              raise SystemExit("trips.service_id is missing")

          rows = db.execute("""
              SELECT service_id, sunday, monday, tuesday,
                     wednesday, thursday, friday, saturday,
                     start_date, end_date
              FROM calendar
          """).fetchall()

          weekday_numbers = {
              "monday": 0, "tuesday": 1, "wednesday": 2,
              "thursday": 3, "friday": 4, "saturday": 5,
              "sunday": 6
          }

          weekday_columns = [
              "monday", "tuesday", "wednesday",
              "thursday", "friday", "saturday", "sunday"
          ]

          errors = []
          seen = set()
          inactive = []

          for row in rows:
              sid = row["service_id"]

              if sid in seen:
                  errors.append(f"Duplicate service_id: {sid}")

              seen.add(sid)

              try:
                  start = datetime.strptime(
                      str(row["start_date"]), "%Y%m%d"
                  ).date()

                  end = datetime.strptime(
                      str(row["end_date"]), "%Y%m%d"
                  ).date()

              except (ValueError, TypeError):
                  errors.append(
                      f"Invalid dates for service_id {sid}"
                  )
                  continue

              if start > end:
                  errors.append(
                      f"start_date after end_date: {sid}"
                  )
                  continue

              active = set()

              for day in weekday_columns:
                  value = str(row[day])

                  if value not in ("0", "1"):
                      errors.append(
                          f"Invalid {day} value for "
                          f"service_id {sid}: {value}"
                      )

                  elif value == "1":
                      active.add(weekday_numbers[day])

              if not active:
                  inactive.append(sid)
                  continue

              if (end - start).days >= 6:
                  has_active_date = True

              else:
                  has_active_date = any(
                      (start + timedelta(days=i)).weekday() in active
                      for i in range((end - start).days + 1)
                  )

              if not has_active_date:
                  inactive.append(sid)

          missing_count = db.execute("""
              SELECT COUNT(*)
              FROM (
                  SELECT DISTINCT t.service_id
                  FROM trips t
                  LEFT JOIN calendar c
                    ON c.service_id = t.service_id
                  WHERE c.service_id IS NULL
              )
          """).fetchone()[0]

          print(f"Calendar services: {len(rows):,}")
          print(
              f"Services missing from calendar: {missing_count:,}"
          )
          print(
              f"Services without an active date: {len(inactive):,}"
          )

          if inactive:
              print("\nFirst 50 inactive service IDs:")

              for sid in inactive[:50]:
                  print(f"  {sid}")

          if missing_count:
              errors.append(
                  f"{missing_count} trip service IDs "
                  "missing from calendar"
              )

          if errors:
              print("\nVALIDATION ERRORS:")

              for error in errors:
                  print(f"  - {error}")

              db.close()
              raise SystemExit(1)

          print("\nCalendar validation completed.")

          db.close()
          PY

      - name: Investigate selected services and trips
        shell: bash
        env:
          SERVICE_IDS: ${{ inputs.service_ids }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sqlite3

          db = sqlite3.connect(
              "build/output/israel-transit.sqlite"
          )
          db.row_factory = sqlite3.Row

          service_ids = [
              item.strip()
              for item in os.environ.get(
                  "SERVICE_IDS", ""
              ).split(",")
              if item.strip()
          ]

          if not service_ids:
              print("No service IDs selected.")
              db.close()
              raise SystemExit(0)

          def get_columns(table):
              return {
                  row["name"]
                  for row in db.execute(
                      f'PRAGMA table_info("{table}")'
                  )
              }

          def expression(alias, available, column, fallback="NULL"):
              if column in available:
                  return f'{alias}."{column}"'

              return fallback

          tables = {
              row["name"]
              for row in db.execute("""
                  SELECT name
                  FROM sqlite_master
                  WHERE type='table'
              """)
          }

          for table in [
              "calendar", "trips", "routes",
              "agency", "stops", "stop_times"
          ]:
              if table not in tables:
                  raise SystemExit(f"Missing table: {table}")

          tc = get_columns("trips")
          rc = get_columns("routes")
          ac = get_columns("agency")
          stc = get_columns("stop_times")

          selected = ",".join("?" for _ in service_ids)

          print("\n========== SELECTED SERVICE DETAILS ==========")

          calendar_query = f"""
              SELECT *
              FROM calendar
              WHERE service_id IN ({selected})
              ORDER BY service_id
          """

          for row in db.execute(calendar_query, service_ids):
              print("\nCALENDAR:")
              print(dict(row))

          print("\n========== ROUTES AND OPERATORS ==========")

          trip_fields = [
              "trip_id", "service_id", "route_id",
              "direction_id", "trip_headsign", "shape_id"
          ]

          route_fields = [
              "route_short_name", "route_long_name",
              "route_type", "agency_id"
          ]

          agency_fields = [
              "agency_name", "agency_url", "agency_id"
          ]

          select_parts = [
              expression("t", tc, col) + f' AS "{col}"'
              for col in trip_fields
          ]

          select_parts += [
              expression("r", rc, col) + f' AS "route_{col}"'
              for col in route_fields
          ]

          select_parts += [
              expression("a", ac, col) + f' AS "{col}"'
              for col in agency_fields
          ]

          query = f"""
              SELECT {", ".join(select_parts)}
              FROM trips t
              LEFT JOIN routes r
                ON r.route_id = t.route_id
              LEFT JOIN agency a
                ON a.agency_id = r.agency_id
              WHERE t.service_id IN ({selected})
              ORDER BY t.service_id, t.route_id, t.trip_id
          """

          trips = db.execute(query, service_ids).fetchall()

          print(f"Selected trips: {len(trips):,}")

          route_ids = set()

          for row in trips:
              item = dict(row)
              route_ids.add(item.get("route_id"))

              print("\nTRIP:")

              for key, value in item.items():
                  if value is not None:
                      print(f"  {key}: {value}")

          print("\n========== FIRST AND LAST STOPS ==========")

          if not {
              "trip_id", "stop_id", "stop_sequence"
          }.issubset(stc):

              print("Required stop_times columns are missing.")

          else:
              for trip in trips:
                  trip_id = trip["trip_id"]

                  first = db.execute("""
                      SELECT st.*, s.stop_name
                      FROM stop_times st
                      LEFT JOIN stops s ON s.stop_id = st.stop_id
                      WHERE st.trip_id = ?
                      ORDER BY st.stop_sequence ASC
                      LIMIT 1
                  """, (trip_id,)).fetchone()

                  last = db.execute("""
                      SELECT st.*, s.stop_name
                      FROM stop_times st
                      LEFT JOIN stops s ON s.stop_id = st.stop_id
                      WHERE st.trip_id = ?
                      ORDER BY st.stop_sequence DESC
                      LIMIT 1
                  """, (trip_id,)).fetchone()

                  print(f"\nTRIP {trip_id}")

                  for label, stop in [
                      ("FIRST", first), ("LAST", last)
                  ]:
                      if stop is None:
                          print(f"  {label}: NO STOP TIMES")
                          continue

                      print(f"  {label}:")
                      print(f"    stop_id: {stop['stop_id']}")
                      print(f"    stop_name: {stop['stop_name']}")
                      print(
                          f"    stop_sequence: "
                          f"{stop['stop_sequence']}"
                      )

                      for time_col in [
                          "arrival_time", "departure_time"
                      ]:
                          if time_col in stc:
                              print(
                                  f"    {time_col}: "
                                  f"{stop[time_col]}"
                              )

          print("\n========== ROUTE NETWORK TABLES ==========")

          network_tables = [
              name for name in sorted(tables)
              if "network" in name.lower()
              or "routenetwork" in name.lower()
              or "cluster" in name.lower()
          ]

          if not network_tables:
              print("No route network tables found.")

          else:
              for table in network_tables:
                  print(f"\nTABLE: {table}")

                  cols = get_columns(table)

                  print("COLUMNS:", ", ".join(sorted(cols)))

                  route_key = next(
                      (c for c in [
                          "route_id", "routeid",
                          "route", "line_id", "lineid"
                      ] if c in cols),
                      None
                  )

                  rows = []

                  if route_key and route_ids:
                      valid_ids = [
                          rid for rid in route_ids
                          if rid is not None
                      ]

                      if valid_ids:
                          placeholders = ",".join(
                              "?" for _ in valid_ids
                          )

                          rows = db.execute(
                              f'SELECT * FROM "{table}" '
                              f'WHERE "{route_key}" IN ({placeholders}) '
                              f'LIMIT 50',
                              valid_ids
                          ).fetchall()

                  if not rows:
                      rows = db.execute(
                          f'SELECT * FROM "{table}" LIMIT 15'
                      ).fetchall()

                  print(f"Rows displayed: {len(rows)}")

                  for row in rows:
                      print(dict(row))

          print("\n========== INSPECTION COMPLETE ==========")

          db.close()
          PY

      - name: Detailed investigation of service 129
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sqlite3

          db = sqlite3.connect(
              "build/output/israel-transit.sqlite"
          )
          db.row_factory = sqlite3.Row

          print("\n========== ALL DATABASE TABLES ==========")

          tables = [
              row["name"]
              for row in db.execute("""
                  SELECT name
                  FROM sqlite_master
                  WHERE type = 'table'
                  ORDER BY name
              """)
          ]

          for table in tables:
              print(table)

          print("\n========== REQUIRED TABLE COLUMNS ==========")

          relevant_tables = [
              "trips",
              "calendar",
              "routes"
          ]

          relevant_tables += [
              table for table in tables
              if "network" in table.lower()
              or "routenetwork" in table.lower()
              or "cluster" in table.lower()
          ]

          for table in dict.fromkeys(relevant_tables):
              if table not in tables:
                  continue

              print(f"\nTABLE: {table}")

              columns = db.execute(
                  f'PRAGMA table_info("{table}")'
              ).fetchall()

              for column in columns:
                  print(
                      f"  {column['name']} "
                      f"({column['type']})"
                  )

          print("\n========== TRIPS: SERVICE 129 ==========")

          trips = db.execute("""
              SELECT *
              FROM trips
              WHERE service_id = ?
              ORDER BY trip_id
          """, ("129",)).fetchall()

          print(f"Number of trips: {len(trips)}")

          for index, trip in enumerate(trips, 1):
              print(f"\nTRIP {index}")

              for key, value in dict(trip).items():
                  print(f"  {key}: {value}")

          print("\n========== CALENDAR: SERVICE 129 ==========")

          calendar = db.execute("""
              SELECT *
              FROM calendar
              WHERE service_id = ?
          """, ("129",)).fetchall()

          print(
              f"Number of calendar records: {len(calendar)}"
          )

          for row in calendar:
              for key, value in dict(row).items():
                  print(f"  {key}: {value}")

          print("\n========== INSPECTION COMPLETE ==========")

          db.close()
          PY

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf build
