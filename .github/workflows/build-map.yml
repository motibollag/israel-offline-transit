name: Build Offline Israel Vector Map

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-build
  cancel-in-progress: false

jobs:
  build-and-publish-map:
    name: Generate israel-basemap.pmtiles
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create working directory
        shell: bash
        run: mkdir -p build/store

      - name: Download latest OpenStreetMap data for Israel
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading Israel & Palestine OSM PBF extract from Geofabrik..."
          curl -fL --retry 3 --retry-delay 5 \
            "https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf" \
            -o build/israel.osm.pbf

      - name: Prepare map configuration and Lua processing script
        shell: bash
        run: |
          set -euo pipefail

          # Create Tilemaker config JSON with mandatory metadata fields
          cat << 'EOF' > build/map_config.json
          {
            "layers": {
              "roads": {
                "minzoom": 6,
                "maxzoom": 14,
                "simplify_below": 13,
                "simplify_level": 0.0003
              }
            },
            "settings": {
              "name": "Israel Offline Basemap",
              "version": "1.0",
              "description": "Offline vector roads basemap for Israel",
              "minzoom": 6,
              "maxzoom": 14,
              "basezoom": 14,
              "include_ids": false,
              "compress": "gzip"
            }
          }
          EOF

          # Create Tilemaker Lua script for Israel roads and Hebrew/English street labels
          cat << 'EOF' > build/map_process.lua
          node_keys = { "name", "name:he", "name:en" }

          function init_processing()
          end

          function exit_processing()
          end

          function node_function()
          end

          function way_function()
              local highway = Find("highway")
              if highway ~= "" then
                  local kind = ""
                  if highway == "motorway" or highway == "trunk" or highway == "primary" then
                      kind = "highway"
                  elseif highway == "secondary" or highway == "tertiary" then
                      kind = "major_road"
                  elseif highway == "residential" or highway == "unclassified" or highway == "service" or highway == "living_street" then
                      kind = "minor_road"
                  elseif highway == "footway" or highway == "path" or highway == "pedestrian" or highway == "steps" or highway == "cycleway" or highway == "track" then
                      kind = "path"
                  end

                  if kind ~= "" then
                      Layer("roads", false)
                      Attribute("kind", kind)
                      
                      local name_he = Find("name:he")
                      local name_en = Find("name:en")
                      local name = Find("name")
                      
                      if name_he ~= "" then Attribute("name:he", name_he) end
                      if name_en ~= "" then Attribute("name:en", name_en) end
                      if name ~= "" then Attribute("name", name) end

                      if kind == "highway" then
                          MinZoom(6)
                      elseif kind == "major_road" then
                          MinZoom(9)
                      elseif kind == "minor_road" then
                          MinZoom(11)
                      else
                          MinZoom(13)
                      end
                  end
              end
          end
          EOF

      - name: Generate PMTiles vector map using Tilemaker
        shell: bash
        run: |
          set -euo pipefail
          echo "Generating PMTiles vector map using Docker..."

          docker run --rm \
            -v "$(pwd)/build:/data" \
            ghcr.io/systemed/tilemaker:master \
            /data/israel.osm.pbf \
            --output=/data/israel-basemap.pmtiles \
            --config=/data/map_config.json \
            --process=/data/map_process.lua \
            --store=/data/store

      - name: Verify generated map file
        shell: bash
        run: |
          set -euo pipefail

          MAP="build/israel-basemap.pmtiles"
          if [ ! -f "$MAP" ]; then
            echo "Error: Map file was not created."
            exit 1
          fi

          SIZE=$(stat -c%s "$MAP")
          echo "Generated map file size: $SIZE bytes"

          if [ "$SIZE" -lt 5000000 ]; then
            echo "Error: Generated map is suspiciously small ($SIZE bytes)."
            exit 1
          fi

          # Verify PMTiles v3 magic header
          HEADER=$(head -c 7 "$MAP")
          if [ "$HEADER" != "PMTiles" ]; then
            echo "Error: File does not have PMTiles header."
            exit 1
          fi

          echo "Map validation passed successfully."

      - name: Publish map release
        id: publish_map
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="map-$(date -u +%Y%m%d-%H%M%S)"

          gh release create "$TAG" \
            build/israel-basemap.pmtiles \
            --title "Offline Map $TAG" \
            --notes "Offline vector basemap (PMTiles v3) covering roads, streets and walking paths for Israel."

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Delete previous map releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NEW_TAG="${{ steps.publish_map.outputs.tag }}"

          mapfile -t MAP_TAGS < <(
            gh release list --limit 1000 --json tagName \
              --jq '.[].tagName'
          )

          for OLD_TAG in "${MAP_TAGS[@]}"; do
            if [[ "$OLD_TAG" =~ ^map-[0-9]{8}-[0-9]{6}$ ]] \
              && [[ "$OLD_TAG" != "$NEW_TAG" ]]; then
              echo "Deleting old map release: $OLD_TAG"
              gh release delete "$OLD_TAG" --yes --cleanup-tag
            fi
          done

      - name: Clean up temporary files
        if: always()
        shell: bash
        run: rm -rf build
