
name: Update Israeli Transit Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: transit-data-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish transit database
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official transport data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/source build/output

          curl -fL --retry 3 --retry-delay 5 \
            "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip" \
            -o build/source/israel-public-transportation.zip
          curl -fL --retry 3 --retry-delay 5 \
            "https://gtfs.mot.gov.il/gtfsfiles/RouteNetworksByDate_10_Days.zip" \
            -o build/source/RouteNetworksByDate_10_Days.zip

      - name: Verify source archives
        shell: bash
        run: |
          set -euo pipefail

          python -m zipfile -t build/source/israel-public-transportation.zip
          python -m zipfile -t build/source/RouteNetworksByDate_10_Days.zip

      - name: Build SQLite database
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_data.py \
            --gtfs build/source/israel-public-transportation.zip \
            --networks build/source/RouteNetworksByDate_10_Days.zip \
            --output build/output/israel-transit.sqlite

      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          repository: motibollag/app
          path: app-source

      - name: Prepare routing data
        shell: bash
        run: |
          set -euo pipefail

          python app-source/app/scripts/prepare_routing_data.py \
            --database build/output/israel-transit.sqlite

      - name: Validate calendar and trip services
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from datetime import datetime, timedelta
          from pathlib import Path

          path = Path("build/output/israel-transit.sqlite")
          db = sqlite3.connect(path)
          db.row_factory = sqlite3.Row

          def columns(table):
              return {
                  row["name"]
                  for row in db.execute(f'PRAGMA table_info("{table}")')
              }

          required_calendar_columns = {
              "service_id",
              "sunday", "monday", "tuesday", "wednesday",
              "thursday", "friday", "saturday",
              "start_date", "end_date"
          }

          calendar_columns = columns("calendar")
          missing_columns = required_calendar_columns - calendar_columns
          if missing_columns:
              raise SystemExit(
                  "calendar is missing columns: "
                  + ", ".join(sorted(missing_columns))
              )

          trip_columns = columns("trips")
          if "service_id" not in trip_columns:
              raise SystemExit("trips is missing service_id")

          weekday_columns = [
              "monday", "tuesday", "wednesday",
              "thursday", "friday", "saturday", "sunday"
          ]

          calendar_rows = db.execute("""
              SELECT service_id, sunday, monday, tuesday,
                     wednesday, thursday, friday, saturday,
                     start_date, end_date
              FROM calendar
          """).fetchall()

          print(f"Calendar services: {len(calendar_rows):,}")

          errors = []
          seen_ids = set()
          inactive_services = []

          for row in calendar_rows:
              service_id = row["service_id"]

              if service_id in seen_ids:
                  errors.append(
                      f"Duplicate calendar service_id: {service_id}"
                  )
              seen_ids.add(service_id)

              try:
                  start = datetime.strptime(
                      str(row["start_date"]), "%Y%m%d"
                  ).date()
                  end = datetime.strptime(
                      str(row["end_date"]), "%Y%m%d"
                  ).date()
              except (ValueError, TypeError):
                  errors.append(
                      f"Invalid date for service_id {service_id}: "
                      f"{row['start_date']} - {row['end_date']}"
                  )
                  continue

              if start > end:
                  errors.append(
                      f"start_date is after end_date for service_id "
                      f"{service_id}"
                  )
                  continue

              active_days = []
              for column in weekday_columns:
                  value = str(row[column])
                  if value not in ("0", "1"):
                      errors.append(
                          f"Invalid {column} value for service_id "
                          f"{service_id}: {value}"
                      )
                  elif value == "1":
                      active_days.append(column)

              if not active_days:
                  inactive_services.append(service_id)
                  continue

              active_weekdays = {
                  "monday": 0,
                  "tuesday": 1,
                  "wednesday": 2,
                  "thursday": 3,
                  "friday": 4,
                  "saturday": 5,
                  "sunday": 6
              }

              active_weekday_numbers = {
                  active_weekdays[day] for day in active_days
              }

              current = start
              has_active_date = False

              while current <= end:
                  if current.weekday() in active_weekday_numbers:
                      has_active_date = True
                      break
                  current += timedelta(days=1)

              if not has_active_date:
                  inactive_services.append(service_id)

          missing_services = db.execute("""
              SELECT DISTINCT t.service_id
              FROM trips t
              LEFT JOIN calendar c
                  ON t.service_id = c.service_id
              WHERE c.service_id IS NULL
              LIMIT 100
          """).fetchall()

          missing_count = db.execute("""
              SELECT COUNT(DISTINCT t.service_id)
              FROM trips t
              LEFT JOIN calendar c
                  ON t.service_id = c.service_id
              WHERE c.service_id IS NULL
          """).fetchone()[0]

          print("\nSERVICE VALIDATION REPORT")

          if missing_count:
              print(
                  f"ERROR: {missing_count:,} service_id values "
                  "in trips are missing from calendar."
              )
              for row in missing_services:
                  print(f"  Missing service_id: {row['service_id']}")
              errors.append(
                  f"{missing_count} trip service IDs have no calendar entry"
              )
          else:
              print("All trip service IDs exist in calendar.")

          if inactive_services:
              print(
                  f"\nWARNING: {len(inactive_services):,} services "
                  "have no active date in their date range."
              )
              for service_id in inactive_services[:30]:
                  print(f"  Inactive service_id: {service_id}")
              if len(inactive_services) > 30:
                  print("  Additional services omitted from this report.")
          else:
              print("All calendar services have at least one active date.")

          if errors:
              print("\nVALIDATION FAILED:")
              for error in errors:
                  print(f"  - {error}")
              db.close()
              raise SystemExit(1)

          print("\nCalendar and trip service validation successful.")
          db.close()
          PY

      - name: Verify database and report table sizes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("build/output/israel-transit.sqlite")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Database file is missing or empty")

          db = sqlite3.connect(path)

          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          if integrity != "ok":
              raise SystemExit(f"Integrity check failed: {integrity}")

          required = {
              "agency", "routes", "trips", "stops",
              "stop_times", "import_metadata",
              "route_patterns", "route_pattern_stops",
              "trip_patterns"
          }

          tables = {
              row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }

          missing = required - tables
          if missing:
              raise SystemExit("Missing tables: " + ", ".join(sorted(missing)))

          print("\nDATABASE TABLE COUNTS")
          for table in sorted(tables):
              if table.startswith("sqlite_"):
                  continue
              count = db.execute(
                  'SELECT COUNT(*) FROM "' + table.replace('"', '""') + '"'
              ).fetchone()[0]
              print(f"{table}: {count:,} rows")

          print("\nDATABASE SIZE")
          print(f"{path.stat().st_size:,} bytes")

          print("\nTABLE SIZE REPORT")
          try:
              rows = db.execute("""
                  SELECT name, SUM(pgsize) AS bytes
                  FROM dbstat
                  GROUP BY name
                  ORDER BY bytes DESC
              """).fetchall()

              for name, size in rows:
                  print(f"{name}: {size:,} bytes")
          except sqlite3.OperationalError as error:
              print(f"Detailed table report unavailable: {error}")

          db.close()
          print("\nDatabase verification successful.")
          PY

      - name: Compress database
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import gzip
          import shutil
          from pathlib import Path

          source = Path("build/output/israel-transit.sqlite")
          target = Path("build/output/israel-transit.sqlite.gz")

          with source.open("rb") as input_file:
              with target.open("wb") as raw_output:
                  with gzip.GzipFile(
                      filename="israel-transit.sqlite",
                      mode="wb",
                      fileobj=raw_output,
                      compresslevel=6,
                      mtime=0
                  ) as compressed:
                      shutil.copyfileobj(input_file, compressed)

          print(f"Original:   {source.stat().st_size:,} bytes")
          print(f"Compressed: {target.stat().st_size:,} bytes")
          PY

      - name: Verify compressed database
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import gzip
          import sqlite3
          from pathlib import Path

          compressed = Path("build/output/israel-transit.sqlite.gz")
          temporary = Path("build/output/verify.sqlite")

          with gzip.open(compressed, "rb") as source:
              with temporary.open("wb") as target:
                  while True:
                      chunk = source.read(8 * 1024 * 1024)
                      if not chunk:
                          break
                      target.write(chunk)

          db = sqlite3.connect(temporary)
          result = db.execute("PRAGMA integrity_check").fetchone()[0]
          db.close()

          if result != "ok":
              raise SystemExit(
                  f"Compressed database verification failed: {result}"
              )

          temporary.unlink()

          print("Compressed database verified successfully.")
          print(f"Compressed file size: {compressed.stat().st_size:,} bytes")
          PY

      - name: Publish new data release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="data-$(date -u +%Y%m%d-%H%M%S)"

          gh release create "$TAG" \
            build/output/israel-transit.sqlite.gz \
            --title "Transit data $TAG" \
            --notes "Compressed SQLite database generated from official Ministry of Transport data."

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.publish.outputs.tag }}"

          ASSET_NAME="$(
            gh release view "$TAG" \
              --json assets \
              --jq '.assets[].name'
          )"

          if ! grep -Fxq "israel-transit.sqlite.gz" <<< "$ASSET_NAME"; then
            echo "Published compressed database was not found."
            exit 1
          fi

          echo "Published release verified successfully."

      - name: Delete previous data releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NEW_TAG="${{ steps.publish.outputs.tag }}"

          if [[ ! "$NEW_TAG" =~ ^data-[0-9]{8}-[0-9]{6}$ ]]; then
            echo "Unexpected tag. Refusing to delete releases."
            exit 1
          fi

          mapfile -t RELEASE_TAGS < <(
            gh release list --limit 1000 --json tagName \
              --jq '.[].tagName'
          )

          for OLD_TAG in "${RELEASE_TAGS[@]}"; do
            if [[ "$OLD_TAG" =~ ^data-[0-9]{8}-[0-9]{6}$ ]] \
              && [[ "$OLD_TAG" != "$NEW_TAG" ]]; then
              echo "Deleting old data release: $OLD_TAG"
              gh release delete "$OLD_TAG" --yes --cleanup-tag
            fi
          done

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf build
